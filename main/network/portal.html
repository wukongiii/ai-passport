<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>台球记分 · 设置</title>
<style>*{box-sizing:border-box}body{margin:0;background:#101c25;color:#f2f3e9;font:16px system-ui;line-height:1.6}main{max-width:560px;margin:auto;padding:20px}h1{font-size:24px;margin:6px 0}section{background:#1c303b;border-radius:16px;padding:18px;margin:16px 0}label{display:block;margin:12px 0 4px}input,select,button{width:100%;font:inherit;border-radius:9px;padding:10px;border:1px solid #536775;color:inherit;background:#101c25}input[type=range]{padding:6px 0;accent-color:#74c5b5}button{background:#246b4e;margin-top:16px;border:0;font-weight:600}button:disabled{opacity:.5}.ends{display:flex;justify-content:space-between;font-size:13px;color:#aac0c4}output{display:block;text-align:center;color:#8de0b8;font-size:22px}.muted{color:#aac0c4;font-size:14px}#message{white-space:pre-wrap;color:#edc56b}a{color:#8de0b8}.connection{padding:14px;border-radius:10px;border-left:4px solid #aac0c4;background:#101c25;white-space:pre-wrap;overflow-wrap:anywhere;margin:12px 0}.connection[data-state="1"]{border-color:#edc56b;color:#edc56b}.connection[data-state="2"]{border-color:#8de0b8;color:#8de0b8}.connection[data-state="3"]{border-color:#ed9a76;color:#ed9a76}</style>
<main><h1>台球记分 · 设置</h1><div class="muted">直接在手机上设置，无需安装应用。设备热点无需密码，为临时连接。</div><p id="status">正在读取设备状态…</p><div id="message" role="status"></div>
<section><h2>连接 Wi-Fi</h2><div id="connection" class="connection" role="status" aria-live="polite">正在读取连接状态…</div><p class="muted">请选择附近的 2.4 GHz 网络，或手动填写名称。连接期间请保留此热点连接；即使手机提示“无法上网”，也请选择继续连接。</p><label for="networks">附近 Wi-Fi</label><select id="networks"><option value="">正在读取网络列表…</option></select><button id="scan" type="button">重新扫描</button><p id="scanStatus" class="muted" role="status"></p><form id="wifi"><label for="ssid">Wi-Fi 名称（SSID）</label><input id="ssid" name="ssid" autocomplete="off" required maxlength="32"><label for="password">Wi-Fi 密码</label><input id="password" name="password" type="password" autocomplete="new-password" maxlength="64"><p class="muted">开放网络可留空；其他网络输入 8–63 个 ASCII 字符，或 64 位十六进制密钥。</p><button id="connect">连接并保存</button></form></section>
<section><h2>显示设置</h2><form id="display"><label for="rotation">屏幕方向</label><select id="rotation" name="rotation"><option value="270">270° · 按键在上</option><option value="90">90° · 按键在下</option></select>
<label for="brightness">亮度</label><output id="brightnessValue"></output><input id="brightness" type="range" min="20" max="100" step="10" name="brightness"><div class="ends"><span>20%</span><span>100%</span></div>
<label for="dim">自动变暗</label><output id="dimValue"></output><input id="dim" type="range" min="0" max="4" step="1"><div class="ends"><span>15 秒</span><span>无限制</span></div>
<label for="blank">自动熄屏</label><output id="blankValue"></output><input id="blank" type="range" min="0" max="4" step="1"><div class="ends"><span>60 秒</span><span>无限制</span></div><button>保存显示设置</button></form></section>
<p class="muted">热点会在设备提示的倒计时结束后关闭。需要再次设置时，在设备“设置 → 网络连接”中重新开启。</p></main>
<script>
const $=id=>document.getElementById(id),dims=[15,30,60,120,0],blanks=[60,120,300,600,0];let token='',loaded=false,pending=false,scanRevision=-1,scanPolling=false,scanStarted=false,statusPolling=false,connecting=false,submittedAt=0;
function values(){ $('brightnessValue').textContent=$('brightness').value+'%';for(const [id,list] of [['dim',dims],['blank',blanks]]){let n=list[$(id).value];$(id+'Value').textContent=n?n+' 秒':'无限制';}}
for(const id of ['brightness','dim','blank'])$(id).oninput=values;
function connectionState(s){
let text='',network=s.ssid?'“'+s.ssid+'”':'Wi-Fi';connecting=s.state===1;
if(submittedAt && s.state!==1 && Date.now()-submittedAt<1500)return;
if(s.state===1){submittedAt=0;text=(s.associated?'已连接路由器，正在获取 IP 地址…':'正在连接 '+network+'…')+'\n第 '+(s.attempt||1)+' / 4 次 · 本次剩余 '+(s.attempt_seconds||0)+' 秒';}
else if(s.state===2){submittedAt=0;text='连接成功 · '+network+'\nIP 地址：'+s.ip+'\n'+(s.save_error?'网络保存失败，请重新提交；重启可能恢复原网络。':'网络已保存，开机自动连接。');}
else if(s.state===3){submittedAt=0;const reasons=['请检查网络、密码及路由器后重试。','认证未通过，请检查 Wi-Fi 密码及路由器设置。','未找到网络，请检查名称、2.4 GHz 频段并靠近路由器。','网络加密方式不兼容，请检查路由器设置。'];text='连接失败 · '+network+'\n'+reasons[s.issue||0]+(s.reason?'（原因码 '+s.reason+'）':'')+'\n修改后点击“连接并保存”重试。';}
else text='尚未连接 Wi-Fi，请选择网络并输入密码。';
$('connection').dataset.state=s.state;$('connection').textContent=text;$('connect').disabled=pending||connecting;$('connect').textContent=connecting?'正在连接…':'连接并保存';
}
async function refresh(){if(statusPolling)return;statusPolling=true;try{let r=await fetch('/api/status',{cache:'no-store',signal:AbortSignal.timeout(5000)});if(!r.ok)throw Error();let s=await r.json();token=s.token;if(!scanStarted){scanStarted=true;startScan();}connectionState(s);$('status').textContent='热点剩余 '+s.seconds+' 秒 · 连接结果见下方';if(!loaded){let f=$('display');f.elements.rotation.value=s.rotation;$('brightness').value=s.brightness;$('dim').value=dims.indexOf(s.dim);$('blank').value=blanks.indexOf(s.blank);values();loaded=true;}}catch(e){$('status').textContent='暂时无法连接设备。请检查是否仍连接设备热点，或重新开启热点。';if(connecting){$('connection').dataset.state=1;$('connection').textContent='正在等待设备连接结果…\n手机可能随路由器切换了热点信道，请保留设备热点连接。暂时失联不代表连接失败，设备屏幕也会显示结果。';}}finally{statusPolling=false;}}
async function send(path,body){if(pending||!token){$('message').textContent='正在连接设备，请稍后重试。';return false;}pending=true;document.querySelectorAll('button').forEach(b=>b.disabled=true);try{let r=await fetch(path,{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded','X-App-Token':token},body});if(!r.ok)throw Error(await r.text());$('message').textContent=path.includes('wifi')?'设备已收到连接请求，结果会在上方实时更新。':'已提交，设备正在应用显示设置。';return true;}catch(e){$('message').textContent='未能提交：'+e.message;return false;}finally{pending=false;document.querySelectorAll('button').forEach(b=>b.disabled=false);$('connect').disabled=connecting;}}
async function readNetworks(){if(scanPolling)return;scanPolling=true;try{let r=await fetch('/api/networks',{cache:'no-store'});if(!r.ok)throw Error();let s=await r.json();$('scan').disabled=pending||s.scanning;
$('scanStatus').textContent=s.scanning?'正在扫描附近网络…':s.error?'扫描未完成，请稍后重新扫描，也可手动输入。':s.attempted?(s.networks.length?'已找到 '+s.networks.length+' 个网络，按信号从强到弱排列。':'未发现可用网络，可重新扫描或手动输入隐藏网络。'):'';
if(s.revision!==scanRevision && !s.scanning){scanRevision=s.revision;let select=$('networks'),chosen=select.value;select.replaceChildren(new Option('请选择网络，或在下方手动输入',''));for(let ap of s.networks){let strength=ap.rssi>=-60?'强':ap.rssi>=-75?'中':'弱';select.add(new Option(ap.ssid+' · '+strength+' · '+(ap.secured?'需密码':'开放'),ap.ssid));}select.value=chosen;}
}catch(e){$('scanStatus').textContent='暂时无法读取网络列表，请检查热点连接。';}finally{scanPolling=false;}}
async function startScan(){if(!token||pending)return;let button=$('scan');button.disabled=true;$('scanStatus').textContent='正在扫描附近网络…';try{let r=await fetch('/api/scan',{method:'POST',headers:{'X-App-Token':token}});if(!r.ok){$('scanStatus').textContent='设备正在连接或扫描，请稍后重新扫描。';button.disabled=false;return;}await readNetworks();}catch(e){$('scanStatus').textContent='无法开始扫描，请检查热点连接。';button.disabled=false;}}
$('scan').onclick=startScan;$('networks').onchange=e=>{if(e.target.value){$('ssid').value=e.target.value;$('password').value='';$('password').focus();}};setInterval(readNetworks,2000);
$('wifi').onsubmit=async e=>{e.preventDefault();let b=new URLSearchParams(new FormData(e.target));if(await send('/api/wifi',b)){e.target.elements.password.value='';connecting=true;submittedAt=Date.now();$('connection').dataset.state=1;$('connection').textContent='正在连接 '+b.get('ssid')+'…\n正在等待设备结果，请保持热点连接。';$('connect').disabled=true;$('connection').scrollIntoView({block:'center',behavior:'smooth'});refresh();}};
$('display').onsubmit=e=>{e.preventDefault();let b=new URLSearchParams(new FormData(e.target));b.set('dim',dims[$('dim').value]);b.set('blank',blanks[$('blank').value]);send('/api/settings',b);};refresh();setInterval(refresh,1000);
</script></html>
